[package]
name = "readaloud"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
cpal = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.20"
onnx-protobuf = "0.2"
# onnx-protobuf 0.2.3 comprueba la versión exacta del crate `protobuf` en el
# código generado (VERSION_3_4_0); con la 3.7.x no compila. Se fija la 3.4.0.
protobuf = "=3.4.0"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
tempfile = "3"
