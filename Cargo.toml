[package]
name = "readaloud"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
zip = { version = "5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
roxmltree = "0.20"

[dev-dependencies]
tempfile = "3"
